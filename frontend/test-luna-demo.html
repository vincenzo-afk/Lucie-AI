<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Luna Demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1d26; overflow: hidden; }
  #live2dCanvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="live2dCanvas"></canvas>
<script type="module">
  import { initSpriteRig } from './js/sprite-rig.js?v=18';
  const rig = await initSpriteRig(document.getElementById('live2dCanvas'));

  const queue = [
    { name: 'touch_hair', at: 800 },
    { name: 'play_hair', at: 4600 },
    { name: 'head_shake', at: 7800 },
    { name: 'head_nod', at: 10100 },
    { name: 'wave', at: 12100 },
    { name: 'giggle', at: 15100 },
    { name: 'point', at: 17600 },
    { name: 'blush', at: 19400 },
  ];
  for (const q of queue) setTimeout(() => rig.playGesture(q.name), q.at);
</script>
</body>
</html>
