<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lucie</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <div id="app">
    <div id="vignette"></div>

    <header id="statusBar">
      <span id="statusDot" class="status-dot status-connecting"></span>
      <span id="statusText" class="mono">connecting…</span>
    </header>

    <main id="stage">
      <canvas id="live2dCanvas"></canvas>
    </main>

    <div id="subtitleArea">
      <p id="subtitleText"></p>
    </div>

    <footer id="controls">
      <div id="micButton" class="mic-btn handsfree-orb" aria-label="Hands-free status">
        <div class="orb-core"></div>
        <div class="orb-ring"></div>
      </div>
      <span id="micHint" class="mono">hands-free mode active</span>
    </footer>
  </div>

  <!-- Polyfill process object for pixi-live2d-display browser compatibility -->
  <script>
    window.process = window.process || { env: { NODE_ENV: 'production' } };
  </script>

  <!-- Live2D Cubism Core (extracted from the official Cubism Web SDK zip) -->
  <script src="live2d/core/live2dcubismcore.min.js"></script>

  <!-- PixiJS v8 renderer + untitled-pixi-live2d-engine (Cubism 2-5 build) -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.19.0/dist/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/untitled-pixi-live2d-engine@1.3.5/dist/cubism.min.js"></script>





  <script type="module" src="js/main.js?v=9"></script>
</body>
</html>
