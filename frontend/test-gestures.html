<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Luna Gesture Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1d26; overflow: hidden; }
  #live2dCanvas { display: block; width: 100%; height: 100%; }
  #dbg { position: fixed; top: 0; left: 0; color: #0f0; font: 13px monospace; background: rgba(0,0,0,.6); padding: 2px 6px; z-index: 99; }
</style>
</head>
<body>
<canvas id="live2dCanvas"></canvas>
<div id="dbg">loading...</div>
<script type="module">
  import { initSpriteRig } from './js/sprite-rig.js?v=19';
  const rig = await initSpriteRig(document.getElementById('live2dCanvas'));
  const gestures = ['touch_hair','play_hair','head_shake','head_nod','wave','giggle','point','blush'];
  const idx = parseInt(new URLSearchParams(location.search).get('g') || '0', 10);
  const name = gestures[idx % gestures.length];
  const dbg = document.getElementById('dbg');
  setTimeout(() => {
    rig.playGesture(name);
    dbg.textContent = 'fired ' + name;
  }, 300);
  setInterval(() => {
    const g = rig.__gesture();
    const arm = rig.__bone('arm_r');
    const al = rig.__bone('arm_l');
    dbg.textContent = name + ' t=' + (g ? ((performance.now()-g.start)/g.duration).toFixed(2) : 'done') +
      ' rotR=' + (arm ? arm.rot.toFixed(1) : 'na') + ' rotL=' + (al ? al.rot.toFixed(1) : 'na') +
      ' syR=' + (arm ? arm.sy.toFixed(2) : 'na') +
      ' vs=' + rig.__viewScale().toFixed(4) + ' vx=' + rig.__viewX().toFixed(1) + ' vy=' + rig.__viewY().toFixed(1);
  }, 200);
</script>
</body>
</html>
